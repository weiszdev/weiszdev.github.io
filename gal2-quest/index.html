*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:linear-gradient(160deg,#2b2350,#4b3a8c 55%,#e08aa8);color:#fff;font-family:FredokaLocal,system-ui,sans-serif;overflow-x:hidden}
#app{max-width:520px;margin:0 auto;min-height:100%;padding:calc(10px + env(safe-area-inset-top)) 14px 24px;display:flex;flex-direction:column}
.hud{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:15px;min-height:36px}
.pill{background:rgba(255,255,255,.15);border-radius:20px;padding:5px 11px;white-space:nowrap}
.icon{background:rgba(255,255,255,.18);border:0;color:#fff;border-radius:50%;width:38px;height:38px;font-size:18px;cursor:pointer}
.screen{flex:1;display:flex;flex-direction:column;gap:12px;animation:fade .35s}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
h1{font-size:34px;margin:6px 0 0;text-align:center;line-height:1.05;color:#ffe27a;text-shadow:0 3px 0 #0004}
h2{font-size:24px;margin:4px 0;color:#ffe27a}
p{margin:0;font-size:17px;line-height:1.4}
.card{background:#fff;color:#2b2350;border-radius:18px;padding:14px;box-shadow:0 6px 0 #0003}
.card.verse{background:#fff8e1;border-left:6px solid #f2b705}
.ref{font-size:13px;opacity:.7;margin-top:6px}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;font-size:18px;cursor:pointer;background:#ffe27a;color:#2b2350;box-shadow:0 5px 0 #b8922b;margin-top:4px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b8922b}
.btn.alt{background:#fff;box-shadow:0 5px 0 #9a8fc9}
.btn.ok{background:#7be08f;box-shadow:0 5px 0 #3c9c50}
.btn.bad{background:#ff9a9a;box-shadow:0 5px 0 #b64b4b}
.btn[disabled]{opacity:.6}
.row{display:flex;gap:10px}.row .btn{flex:1}
.choices .btn{text-align:left;font-size:16px}
.chars{display:flex;justify-content:center;align-items:flex-end;gap:6px;height:150px}
.chars img{height:140px;filter:drop-shadow(0 4px 4px #0005)}
.chars img.girl{height:120px}
.bounce{animation:bounce .6s}@keyframes bounce{40%{transform:translateY(-18px)}}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.timer{height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
.timer i{display:block;height:100%;background:#7be08f;width:100%}
.say{background:#2b2350;color:#fff;border:0;border-radius:12px;padding:6px 10px;font:inherit;font-size:14px;margin-top:8px;cursor:pointer}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tile{background:#fff;color:#2b2350;border:0;border-radius:12px;padding:10px 12px;font:inherit;font-size:16px;box-shadow:0 4px 0 #9a8fc9;cursor:pointer}
.tile.used{visibility:hidden}
.built{min-height:90px;background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.4);border-radius:14px;padding:10px;font-size:17px;line-height:1.5}
.built span{background:#ffe27a;color:#2b2350;border-radius:8px;padding:2px 6px;margin:2px;display:inline-block}
.blank{display:inline-block;min-width:70px;border-bottom:3px solid #f2b705;text-align:center;font-weight:bold}
.boss{display:flex;align-items:center;gap:10px}
.bossface{font-size:54px}.hp{flex:1;height:16px;background:#0004;border-radius:8px;overflow:hidden}.hp i{display:block;height:100%;background:#ff6b6b;transition:width .3s}
.hearts{font-size:22px}
.toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:30px;background:#2b2350ee;padding:12px 22px;border-radius:18px;pointer-events:none;opacity:0;transition:opacity .2s;z-index:9;text-align:center}
.toast.show{opacity:1}
.big{font-size:56px;text-align:center;color:#ffe27a;margin:0}
.map{display:grid;grid-template-columns:1fr;gap:8px}
.lvl{display:flex;justify-content:space-between;align-items:center;background:rgba(255,255,255,.14);border-radius:14px;padding:10px 14px;font-size:16px}
small{opacity:.8}
.foot{text-align:center;font-size:12px;opacity:.7;margin-top:16px}
</style></head><body>

const Q=new URLSearchParams(location.search);
const S={score:0,combo:0,best:0,level:0,voice:!Q.has('novoice'),correct:0,total:0,lvlScore:[0,0,0,0,0]};
const $=s=>document.querySelector(s),main=$('#main');
let curAudio=null,timerId=null;
function say(k){if(!S.voice||!AUD[k])return;try{if(curAudio)curAudio.pause();curAudio=new Audio(AUD[k]);curAudio.play().catch(()=>{})}catch(e){}}
function stopSay(){if(curAudio){curAudio.pause();curAudio=null}}
let actx=null;function beep(ok){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();const o=actx.createOscillator(),g=actx.createGain();o.connect(g);g.connect(actx.destination);o.type='triangle';const t=actx.currentTime;o.frequency.setValueAtTime(ok?660:220,t);if(ok)o.frequency.setValueAtTime(880,t+.08);g.gain.setValueAtTime(.15,t);g.gain.exponentialRampToValueAtTime(.001,t+.25);o.start(t);o.stop(t+.26)}catch(e){}}
function toast(t){const e=$('#toast');e.innerHTML=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),900)}
function hud(){$('#hud').innerHTML=`<span class="pill">⭐ ${S.score}</span><span class="pill">🔥 x${Math.max(1,S.combo)}</span><span class="pill">${S.level?'Level '+S.level+'/5':'Grace Quest'}</span><button class="icon" id="vbtn" aria-label="voice">${S.voice?'🔊':'🔈'}</button>`;$('#vbtn').onclick=()=>{S.voice=!S.voice;if(!S.voice)stopSay();hud()}}
function mult(){return Math.min(4,1+Math.floor(S.combo/3))}
function right(base,timeFrac){S.combo++;S.best=Math.max(S.best,S.combo);const pts=Math.round((base+(timeFrac||0)*50)*mult());S.score+=pts;S.lvlScore[S.level-1]+=pts;S.correct++;S.total++;beep(true);toast('✅ +'+pts+(mult()>1?'<br><small>combo x'+mult()+'</small>':''));hud();return pts}
function wrong(){S.combo=0;S.total++;beep(false);hud()}
function clearT(){if(timerId){cancelAnimationFrame(timerId);timerId=null}}
function runTimer(sec,el,onEnd){clearT();const t0=performance.now();const f=()=>{const fr=1-(performance.now()-t0)/(sec*1000);el.style.width=Math.max(0,fr*100)+'%';el.style.background=fr<.3?'#ff6b6b':'#7be08f';if(fr<=0){timerId=null;onEnd();return}timerId=requestAnimationFrame(f)};timerId=requestAnimationFrame(f);return()=>Math.max(0,1-(performance.now()-t0)/(sec*1000))}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function chars(mood){return `<div class="chars"><img src="${mood==='happy'?IMG.happy:IMG.bunny}" alt="Bunny" id="bun"><img class="girl" src="${IMG.girl}" alt="Bunny's friend"></div>`}
function verse(k,txt,ref){return `<div class="card verse"><p>“${txt}”</p><div class="ref">${ref} (modern paraphrase)</div><button class="say" data-say="${k}">🔊 Hear it</button></div>`}
function wire(){main.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say))}
function show(h){clearT();main.innerHTML=`<div class="screen">${h}</div>`;wire();window.scrollTo(0,0)}
const V16='We know a person is not made right with God by doing what the law says, but by faith in Jesus Christ.';
const V20='I have been crucified with Christ. It is no longer I who live, but Christ lives in me. The life I now live, I live by faith in the Son of God, who loved me and gave himself for me.';
const V21='I do not set aside the grace of God. If we could be made right by keeping the law, then Christ died for nothing.';

// ---------- TITLE ----------
function title(){S.level=0;hud();show(`<h1>Grace Quest</h1><p style="text-align:center">Galatians 2 · 5 levels · beat the boss!</p>${chars('happy')}
<div class="card"><p>Bunny (she's grown up a bit!) and her friend are on a quest to learn the biggest truth in Galatians 2: <b>God makes us right with Him by faith in Jesus, not by what we do.</b></p></div>
<div class="map">${['Grace or Earning?','The Antioch Table','Verse Builder','Fill the Gap','Boss: The Lie of “Earn It”'].map((n,i)=>`<div class="lvl"><span>${i+1}. ${n}</span><span>${['⚡','🍞','🧩','✏️','👾'][i]}</span></div>`).join('')}</div>
<button class="btn" id="go">▶ Start the quest</button><p style="text-align:center;font-size:14px;opacity:.85">Answer fast for bonus points. 3 right in a row = combo!</p>`);
$('#go').onclick=()=>{say('intro');L1()}}

function intro(n,name,body,next){S.level=n;hud();show(`<h2>Level ${n}: ${name}</h2>${body}<button class="btn" id="go">Let's go ▶</button>`);$('#go').onclick=()=>{stopSay();next()}}

// ---------- L1: Grace or Earning (timed sort) ----------
const L1Q=[["“If I read my Bible every day, God will love me more.”","earn","God already loves you fully in Jesus. Reading the Bible helps you know Him, but it doesn't buy His love."],
["“Jesus died for me while I was still a sinner.”","grace","That's grace: He loved us first (Romans 5:8)."],
["“I'm made right with God because I trust Jesus.”","grace","Galatians 2:16: by faith in Christ!"],
["“I'm a good kid, so I don't really need Jesus.”","earn","Everyone needs Jesus. Nobody is good enough on their own."],
["“I obey God because I love Him, not to get Him to love me.”","grace","Yes! Obedience is a thank-you, not a payment."],
["“I messed up badly, so God is done with me.”","earn","That thinking says it depends on you. In Christ, there's forgiveness. Come back to Him!"],
["“Christ lives in me and helps me live for Him.”","grace","Galatians 2:20!"],
["“If I keep enough rules, God owes me heaven.”","earn","Galatians 2:21: if rules could save us, Christ died for nothing."]];
function L1(){intro(1,'Grace or Earning?',`${verse('v16',V16,'Galatians 2:16')}<div class="card"><p>Read each statement. Is it trusting <b>GRACE</b> (what Jesus did) or trying to <b>EARN</b> it (what I do)? You have 8 seconds each.</p></div>`,()=>{let qs=shuffle(L1Q),i=0;const next=()=>{if(i>=qs.length)return done(1,L2);const [q,a,why]=qs[i++];show(`<p>Statement ${i} of ${qs.length}</p><div class="timer"><i id="tb"></i></div><div class="card"><p style="font-size:20px">${q}</p></div>${chars()}<div class="row"><button class="btn ok" data-a="grace">🎁 Grace</button><button class="btn bad" data-a="earn">💪 Earning</button></div><div id="fb"></div>`);let answered=false;const left=runTimer(8,$('#tb'),()=>{if(!answered){answered=true;wrong();fb(false,"Time's up! "+why)}});
main.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(answered)return;answered=true;clearT();const ok=b.dataset.a===a;if(ok){right(100,left());$('#bun').src=IMG.happy;$('#bun').classList.add('bounce')}else{wrong();$('#bun').classList.add('shake')}fb(ok,why)});
function fb(ok,why){main.querySelectorAll('[data-a]').forEach(b=>b.disabled=true);$('#fb').innerHTML=`<div class="card"><p><b>${ok?'Correct!':'Not quite.'}</b> The answer is <b>${a==='grace'?'Grace':'Earning'}</b>. ${why}</p></div><button class="btn" id="nx">Next ▶</button>`;$('#nx').onclick=next}};next()})}

// ---------- L2: Antioch scenarios ----------
const L2Q=[{s:"In Antioch, Peter ate with the Gentile (non-Jewish) believers. Then some men came from James, and Peter got scared and stopped eating with them. What did Paul do?",c:["Said nothing so nobody would feel awkward","Spoke to Peter face to face, because the truth of the gospel was at stake","Started his own separate table"],a:1,w:"Galatians 2:11–14. Paul spoke up lovingly and clearly. Everyone is accepted by God the same way: by faith in Jesus."},
{s:"Why was Peter's choice a big deal?",c:["It acted like Gentiles had to follow Jewish rules to be fully accepted","Peter didn't like the food","Paul just wanted to win an argument"],a:0,w:"Pulling away sent a message: “You need more than Jesus.” That isn't the gospel."},
{s:"At lunch, your friends won't sit with a new kid who just started coming to church because “he's not like us.” What shows the gospel?",c:["Go along with it to stay popular","Invite him to sit with you; Jesus welcomes everyone who trusts Him","Tell him to come back when he fits in better"],a:1,w:"The gospel puts us all at the same table. Nobody earns a seat."},
{s:"A friend says, “God only accepts you if you never mess up.” What's a true and kind answer?",c:["“Yeah, so try harder.”","“No one is good enough. God accepts us because of Jesus, and He helps us change.”","“God doesn't care what we do.”"],a:1,w:"Both mistakes are off: earning it, and not caring. Grace saves us AND changes us (2:20)."},
{s:"Standing for the truth like Paul means…",c:["Being loud and mean to win","Speaking the truth in love, even when it's hard","Only standing up when it's easy"],a:1,w:"Paul was brave AND his goal was to protect the gospel and the people, not to win."}];
function L2(){intro(2,'The Antioch Table',`<div class="card"><p>In Galatians 2:11–14, Paul stood up for <b>“the truth of the gospel.”</b> Pick the choice that shows the truth. Fast answers get more points.</p></div><button class="say" data-say="antioch">🔊 Hear the story</button>${chars()}`,()=>{let i=0;const next=()=>{if(i>=L2Q.length)return done(2,L3);const q=L2Q[i++];const order=shuffle([0,1,2]);show(`<p>Scenario ${i} of ${L2Q.length}</p><div class="timer"><i id="tb"></i></div><div class="card"><p>${q.s}</p></div><div class="choices">${order.map(k=>`<button class="btn alt" data-k="${k}">${q.c[k]}</button>`).join('')}</div><div id="fb"></div>`);let ans=false;const left=runTimer(20,$('#tb'),()=>{if(!ans){ans=true;wrong();f(false)}});
main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;clearT();const ok=+b.dataset.k===q.a;b.classList.add(ok?'ok':'bad');ok?(right(150,left()),say('yes')):(wrong(),say('no'));f(ok)});
function f(ok){main.querySelectorAll('[data-k]').forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add('ok')});$('#fb').innerHTML=`<div class="card"><p><b>${ok?'Yes!':'Here\'s the truth:'}</b> ${q.w}</p></div><button class="btn" id="nx">Next ▶</button>`;$('#nx').onclick=next}};next()})}

const L3P=[{ref:'Galatians 2:16',k:'v16',parts:['A person is not','made right with God','by doing what the law says,','but by faith','in Jesus Christ.']},
{ref:'Galatians 2:20',k:'v20',parts:['I have been','crucified with Christ.','It is no longer I who live,','but Christ','lives in me.']},
{ref:'Galatians 2:20',k:'v20',parts:['I live by faith','in the Son of God,','who loved me','and gave himself','for me.']},
{ref:'Galatians 2:21',k:'v21',parts:['If we could be made right','by keeping the law,','then Christ','died for nothing.']}];
function L3(){intro(3,'Verse Builder',`<div class="card"><p>Tap the pieces in the right order to rebuild each verse. Finish fast with no mistakes for big points! A wrong tap breaks your combo.</p></div>${chars('happy')}`,()=>{let i=0;const next=()=>{if(i>=L3P.length)return done(3,L4);const p=L3P[i++];let pos=0,miss=0;const sh=shuffle(p.parts.map((t,j)=>[t,j]));show(`<p>Puzzle ${i} of ${L3P.length} · ${p.ref}</p><div class="timer"><i id="tb"></i></div><div class="built" id="built"></div><div class="tiles">${sh.map(([t,j])=>`<button class="tile" data-j="${j}">${t}</button>`).join('')}</div><div id="fb"></div>`);let fin=false;const left=runTimer(30,$('#tb'),()=>{if(!fin){fin=true;wrong();end(false)}});
main.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(fin)return;if(+b.dataset.j===pos){b.classList.add('used');$('#built').insertAdjacentHTML('beforeend',`<span>${b.textContent}</span>`);pos++;beep(true);if(pos===p.parts.length){fin=true;clearT();right(miss?120:200,left());end(true)}}else{miss++;S.combo=0;hud();beep(false);b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400)}});
function end(ok){$('#fb').innerHTML=`<div class="card verse"><p>${ok?'🎉 ':'⏰ Time! Here it is: '}“${p.parts.join(' ')}”</p><div class="ref">${p.ref}</div><button class="say" data-say="${p.k}">🔊 Hear it</button></div><button class="btn" id="nx">Next ▶</button>`;wire();$('#nx').onclick=next}};next()})}

// ---------- L4: Fill the gap ----------
const L4Q=[{t:'A person is made right with God by ___ in Jesus Christ.',o:['faith','effort','luck','rules'],a:0,r:'2:16'},
{t:'I have been ___ with Christ.',o:['baptized','crucified','walking','raised'],a:1,r:'2:20'},
{t:'It is no longer I who live, but ___ lives in me.',o:['my best self','Christ','the law','Paul'],a:1,r:'2:20'},
{t:'The Son of God ___ me and gave himself for me.',o:['tested','judged','loved','chose'],a:2,r:'2:20'},
{t:'I do not set aside the ___ of God.',o:['grace','rules','anger','temple'],a:0,r:'2:21'},
{t:'If we could be made right by keeping the law, Christ died for ___.',o:['us','nothing','Israel','a while'],a:1,r:'2:21'},
{t:'Paul opposed Peter because he wasn\'t living in line with the ___ of the gospel.',o:['rules','truth','feelings','traditions'],a:1,r:'2:14'}];
function L4(){intro(4,'Fill the Gap',`${verse('v20',V20,'Galatians 2:20')}${verse('v21',V21,'Galatians 2:21')}<div class="card"><p>Pick the missing word. 10 seconds each!</p></div>`,()=>{let qs=shuffle(L4Q),i=0;const next=()=>{if(i>=qs.length)return done(4,L5);const q=qs[i++];const ord=shuffle([0,1,2,3]);show(`<p>Gap ${i} of ${qs.length} · Galatians ${q.r}</p><div class="timer"><i id="tb"></i></div><div class="card"><p style="font-size:20px">${q.t.replace('___','<span class="blank" id="bl">?</span>')}</p></div><div class="row">${ord.slice(0,2).map(k=>`<button class="btn alt" data-k="${k}">${q.o[k]}</button>`).join('')}</div><div class="row">${ord.slice(2).map(k=>`<button class="btn alt" data-k="${k}">${q.o[k]}</button>`).join('')}</div>`);let ans=false;const left=runTimer(10,$('#tb'),()=>{if(!ans){ans=true;wrong();f()}});
main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;clearT();const ok=+b.dataset.k===q.a;b.classList.add(ok?'ok':'bad');ok?right(100,left()):wrong();f()});
function f(){$('#bl').textContent=q.o[q.a];main.querySelectorAll('[data-k]').forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add('ok')});setTimeout(next,1300)}};next()})}

// ---------- L5: Boss ----------
const L5Q=[{t:'How does a person become right with God?',o:['By trusting Jesus','By being better than others'],a:0},
{t:'True or false: Good works earn God\'s love.',o:['True','False'],a:1},
{t:'What does “Christ lives in me” mean?',o:['Jesus gives me new life and lives through me','I have to save myself'],a:0},
{t:'Who stood up for the truth of the gospel in Antioch?',o:['Paul','Pharaoh'],a:0},
{t:'If rules could save us, then…',o:['Christ died for nothing','Jesus was extra credit'],a:0},
{t:'Why do Christians obey God?',o:['To pay Him back','Out of love and thanks, by His Spirit'],a:1},
{t:'Jesus loved me and…',o:['gave himself for me','waited for me to be good enough'],a:0},
{t:'Who gets the glory for our salvation?',o:['Me','God'],a:1},
{t:'Peter was wrong to pull away from Gentile believers because…',o:['Everyone is saved the same way, by grace','Gentiles had better food'],a:0},
{t:'Does grace mean sin doesn\'t matter?',o:['Yes, do whatever','No, Christ in me changes how I live'],a:1}];
function L5(){intro(5,'Boss: The Lie of “Earn It”',`<div class="boss"><div class="bossface">👾</div><div><p>The <b>Earn-It Lie</b> says: “You have to work your way to God.”</p></div></div><div class="card"><p>Knock it out with truth! Every right answer hits it. You have 3 hearts and 7 seconds per question.</p></div><button class="say" data-say="boss">🔊</button>${chars()}`,()=>{say('boss');let hp=8,hearts=3,qs=shuffle(L5Q),i=0;const next=()=>{if(hp<=0)return done(5,win,true);if(hearts<=0)return lose();if(i>=qs.length){qs=shuffle(L5Q);i=0}const q=qs[i++];const ord=shuffle([0,1]);show(`<div class="boss"><div class="bossface" id="bf">👾</div><div class="hp"><i style="width:${hp/8*100}%"></i></div></div><div class="hearts">${'❤️'.repeat(hearts)}${'🤍'.repeat(3-hearts)}</div><div class="timer"><i id="tb"></i></div><div class="card"><p style="font-size:20px">${q.t}</p></div>${ord.map(k=>`<button class="btn alt" data-k="${k}">${q.o[k]}</button>`).join('')}`);let ans=false;const left=runTimer(7,$('#tb'),()=>{if(!ans){ans=true;wrong();hearts--;toast('⏰');setTimeout(next,900)}});
main.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{if(ans)return;ans=true;clearT();const ok=+b.dataset.k===q.a;b.classList.add(ok?'ok':'bad');if(ok){right(150,left());hp--;$('#bf').classList.add('shake')}else{wrong();hearts--;main.querySelectorAll('[data-k]').forEach(x=>{if(+x.dataset.k===q.a)x.classList.add('ok')})}setTimeout(next,ok?800:1400)})};
const lose=()=>show(`<h2>Out of hearts!</h2><div class="card"><p>Good news: grace gives second chances. God doesn't give up on you, and neither does this quest. Try the boss again!</p></div>${chars()}<button class="btn" id="re">Try again ▶</button>`)||($('#re').onclick=()=>{hp=8;hearts=3;next()});next()})}

function done(n,next,boss){S.level=n;hud();show(`<h2>${boss?'Boss defeated! 🎉':'Level '+n+' complete!'}</h2><p class="big">+${S.lvlScore[n-1]}</p>${chars('happy')}<div class="card"><p>Total: <b>${S.score}</b> · Best combo: <b>${S.best}</b></p></div><button class="btn" id="nx">${boss?'See results ▶':'Next level ▶'}</button>`);$('#bun').classList.add('bounce');$('#nx').onclick=next}

function win(){S.level=5;say('win');const acc=S.total?Math.round(S.correct/S.total*100):0;const rank=S.score>=10000?'Gospel Defender 🛡️':S.score>=6500?'Truth Teller 📣':S.score>=3500?'Grace Explorer 🧭':'Faith Rookie 🌱';
const msg=`I scored ${S.score} in Grace Quest (Galatians 2)! Rank: ${rank.replace(/\s\S+$/,'')}. Best combo ${S.best}, ${acc}% right. Jesus loved me and gave himself for me.`;
show(`<h1>Quest Complete!</h1><p class="big">${S.score}</p><p style="text-align:center;font-size:22px">${rank}</p>${chars('happy')}<div class="card"><p>✅ ${S.correct}/${S.total} right (${acc}%) · 🔥 best combo ${S.best}</p></div>${verse('v20',V20,'Galatians 2:20')}<div class="card"><p>You didn't earn God's love by scoring points, and nobody does! Jesus gave Himself for you. Trust Him, and live for Him because He lives in you. All glory to God!</p></div><button class="btn" id="sh">📤 Share my score</button><button class="btn alt" id="again">↻ Play again</button>`);
$('#sh').onclick=async()=>{const url=location.href.split('?')[0];try{if(navigator.share){await navigator.share({title:'Grace Quest',text:msg,url});return}}catch(e){if(e&&e.name==='AbortError')return}try{await navigator.clipboard.writeText(msg+' '+url);toast('📋 Copied!')}catch(e){prompt('Copy this:',msg+' '+url)}};
$('#again').onclick=()=>{Object.assign(S,{score:0,combo:0,best:0,correct:0,total:0,lvlScore:[0,0,0,0,0]});title()}}

const start=+Q.get('level')||0;hud();[title,L1,L2,L3,L4,L5][start]?[title,L1,L2,L3,L4,L5][start]():title();
</script></body></html>
